[project]
name = "elite-swing-trader"
version = "0.1.0"
description = "Quant-first crypto swing trading system (Flask dashboard, execution, ML helpers)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.2.0",
    "flask-cors>=4.0.0",
    "flask>=3.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "optuna>=4.0.0",
    "pandas>=2.0.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.0.0",
    "quantstats>=0.0.62",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "shap>=0.44.0",
    "truststore>=0.10.0",
    "vectorbt>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "pytest>=7.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["."]
exclude = [
    ".venv",
    "defi-mcp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
